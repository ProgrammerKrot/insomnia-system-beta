[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Adwaita-dark'
icon-theme='Papirus-Dark'
cursor-theme='Adwaita'
font-name='Inter 10'
document-font-name='Inter 10'
monospace-font-name='JetBrainsMono Nerd Font 10'
enable-animations=true
show-battery-percentage=true

[org/gnome/desktop/background]
picture-uri=''
picture-uri-dark=''
primary-color='#000000'
secondary-color='#000000'
color-shading-type='solid'

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-uri=''
primary-color='#000000'
secondary-color='#000000'

[org/gnome/mutter]
experimental-features=['variable-refresh-rate', 'scale-monitor-framebuffer']
dynamic-workspaces=true

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-battery-timeout=300
sleep-inactive-battery-type='suspend'
sleep-inactive-ac-timeout=1800
sleep-inactive-ac-type='nothing'
power-button-action='suspend'
ambient-enabled=true

[org/gnome/desktop/session]
idle-delay=uint32 180

[org/gnome/shell]
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'user-theme@gnome-shell-extensions.gcampax.github.com']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'firefox.desktop']

[org/gnome/terminal/legacy]
theme-variant='dark'

[org/gnome/terminal/legacy/profiles:/:default]
background-color='#000000'
foreground-color='#d4d4d4'
use-system-font=false
font='JetBrainsMono Nerd Font 11'
use-theme-colors=false
audible-bell=false
