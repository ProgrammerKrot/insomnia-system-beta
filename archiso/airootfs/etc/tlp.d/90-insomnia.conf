# Insomnia System — TLP battery profile
# Applies to BOTH regimes whenever the laptop runs on battery.
# EPM (insomnia-power) then goes further: frequency caps, GPU clocks, backlight,
# radios, idle services. AC settings are left at TLP defaults.

TLP_ENABLE=1

# ── CPU (intel_pstate / amd-pstate: EPP is the knob that matters) ──────────
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_BAT=low-power

# ── Sleep: real S3 where the firmware still offers it ────────────────────────
MEM_SLEEP_ON_BAT=deep

# ── Buses & devices ────────────────────────────────────────────────────────
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_BAT=powersupersave
AHCI_RUNTIME_PM_ON_BAT=auto
SATA_LINKPWR_ON_BAT="med_power_with_dipm min_power"
USB_AUTOSUSPEND=1
USB_EXCLUDE_PHONE=1

# ── GPU ────────────────────────────────────────────────────────────────────
# (Intel GPU clocks are capped by insomnia-power in EPM only)
RADEON_DPM_PERF_LEVEL_ON_BAT=low
AMDGPU_ABM_LEVEL_ON_BAT=3

# ── Radios ─────────────────────────────────────────────────────────────────
WIFI_PWR_ON_BAT=on
WOL_DISABLE=Y
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth nfc wwan"

# ── Audio / kernel ─────────────────────────────────────────────────────────
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
NMI_WATCHDOG=0
