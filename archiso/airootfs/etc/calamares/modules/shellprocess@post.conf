# Calamares — shellprocess@post
# Commands to run inside the installed system after all other modules.
---
dontChroot: false
timeout: 120

script:
    - "-":  "systemctl enable tlp.service"
    - "-":  "systemctl enable NetworkManager.service"
    - "-":  "systemctl enable acpid.service"
    - "-":  "systemctl enable insomnia-init.service"
    - "-":  "plymouth-set-default-theme insomnia && mkinitcpio -P"
    - "-":  "chsh -s /bin/zsh root"
    # Remove live-session user artifacts
    - "-":  "userdel -r liveuser 2>/dev/null || true"
    - "-":  "rm -f /etc/sudoers.d/g_wheel_nopasswd"
    # Apply GNOME dconf profile
    - "-":  "dconf update"
